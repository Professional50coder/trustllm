name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: CLI bundle is up to date
        run: |
          pnpm build:cli
          git diff --exit-code dist/cli.cjs
      - name: CLI smoke test (demo mode, exit codes)
        run: |
          node dist/cli.cjs init smoke.yaml
          node dist/cli.cjs run smoke.yaml
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t trustllm .
      - name: Run image and call the API
        run: |
          docker run -d -p 3000:3000 --name trustllm-ci trustllm
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 1; done
          curl -fs -X POST localhost:3000/api/evaluate -H 'content-type: application/json' \
            -d '{"mode":"demo","cases":[{"prompt":"How long is the refund window?","context":"Refunds are allowed within 30 days of purchase by customers."}],"models":[{"provider":"demo","model":"demo-careful"}]}' | grep -q '"gate":"PASS"'

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action from this repository
        uses: ./
        with:
          config: examples/trustllm.yaml
          json: report.json
      - name: Report was written and the gate passed
        run: |
          test -s report.json
          node -e "const r=require('./report.json'); if (r.summary.gate !== 'PASS' || r.results.length !== 2) process.exit(1)"
